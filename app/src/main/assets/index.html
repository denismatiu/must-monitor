<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1115">
<title>Must Monitor</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --fg:#e6e8ee; --dim:#8a90a0; --ok:#3ecf8e; --warn:#f5a524; --bad:#f31260; --pv:#f5c542; --load:#4ea1ff; --bat:#b57cff; --grid:#2dd4bf; --focus:#4ea1ff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); }
  @media (min-width: 1200px) { body { padding:0 24px; font-size:17px; } }
  button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, canvas:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 16px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  h2 { font-size:15px; margin:0; font-weight:600; }
  .hdr-right { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .chip { padding:5px 10px; border-radius:999px; font-size:13px; background:var(--card); white-space:nowrap; }
  .chip.ok { color:var(--ok); } .chip.bad { color:var(--bad); } .chip.warn { color:var(--warn); }
  .hero { margin:0 16px 12px; padding:16px; background:var(--card); border-radius:14px; transition:opacity .3s; }
  .hero.stale { opacity:.55; }
  .hero .row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .soc { font-size:44px; font-weight:700; font-variant-numeric: tabular-nums; }
  .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin:10px 0 10px; }
  .bar > div { height:100%; background:var(--line); transition:width .4s; }
  .runtime { font-size:19px; font-weight:600; }
  .flow { margin-top:6px; font-size:15px; font-weight:500; }
  .flow.chg { color:var(--ok); } .flow.dis { color:var(--warn); }
  .gridline { margin-top:6px; font-size:14px; }
  .gridline.on { color:var(--ok); } .gridline.off { color:var(--bad); }
  .sub { color:var(--dim); font-size:12px; margin-top:8px; line-height:1.4; }
  .alert { margin-top:10px; padding:8px 10px; border-radius:8px; background:rgba(243,18,96,.12); color:#ff8fb0; font-size:13px; }
  .alert:empty { display:none; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:0 16px; }
  .card { background:var(--card); border-radius:12px; padding:12px; }
  .card .k { color:var(--dim); font-size:12px; }
  .card .v { font-size:22px; font-weight:600; margin-top:4px; font-variant-numeric: tabular-nums; }
  .card .v.na { font-size:14px; font-weight:500; color:var(--dim); padding-top:6px; }
  .card .s { color:var(--dim); font-size:11px; margin-top:2px; }
  details.more { margin:10px 16px 0; background:none; padding:0; }
  details.more > summary { color:var(--dim); font-size:14px; font-weight:500; padding:10px 0; min-height:44px; }
  details.more .grid { margin:0; }
  .section-head { display:flex; justify-content:space-between; align-items:center; margin:20px 16px 10px; gap:10px; }
  .tabs { display:flex; background:var(--card); border-radius:999px; padding:3px; }
  .tabs button { background:none; border:0; color:var(--dim); min-height:40px; padding:0 16px; border-radius:999px; font:inherit; font-size:14px; cursor:pointer; }
  .tabs button[aria-pressed="true"] { background:var(--line); color:var(--fg); }
  .stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin:0 16px; }
  .stats .v { font-size:18px; }
  .chart { margin:10px 16px; background:var(--card); border-radius:12px; padding:12px; }
  .chart-head { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--dim); }
  .legend i { display:inline-block; width:12px; height:3px; margin-right:5px; vertical-align:middle; border-radius:2px; }
  .legend i.dash { background:repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; }
  canvas { width:100%; height:200px; display:block; touch-action:pan-y; }
  canvas.short { height:140px; }
  canvas.thin { height:100px; }
  .chart-msg { color:var(--dim); font-size:13px; }
  .chart-msg:empty { display:none; }
  .outages { list-style:none; margin:0; padding:0; font-size:14px; }
  .outages li { display:flex; justify-content:space-between; gap:8px; padding:10px 0; border-top:1px solid var(--line); }
  .outages li:first-child { border-top:0; }
  .outages .d { color:var(--dim); font-variant-numeric: tabular-nums; white-space:nowrap; }
  .empty { color:var(--dim); font-size:14px; }
  details.settings { margin:20px 16px; background:var(--card); border-radius:12px; padding:0 12px; }
  details.settings > summary { cursor:pointer; font-weight:600; font-size:15px; padding:12px 0; min-height:44px; }
  .form { display:grid; gap:12px; padding-bottom:14px; }
  .form h3 { font-size:14px; margin:10px 0 0; color:var(--fg); }
  .form label { display:grid; gap:4px; font-size:12px; color:var(--dim); }
  .form input[type=text], .form input[type=password], .form select { background:var(--bg); border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:10px; font:inherit; font-size:15px; width:100%; min-height:44px; }
  .form .check { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--fg); min-height:44px; }
  .form .check input { width:22px; height:22px; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; }
  .btns button, .chat-pick button { background:var(--line); color:var(--fg); border:0; border-radius:8px; min-height:44px; padding:0 16px; font:inherit; font-size:14px; cursor:pointer; }
  .btns button.primary { background:var(--load); color:#071222; font-weight:600; }
  .btns button.danger { background:none; border:1px solid #5a2433; color:#ff8fb0; }
  .btns button:disabled { opacity:.55; cursor:default; }
  .hint { font-size:12px; color:var(--dim); line-height:1.5; }
  .msg { font-size:13px; min-height:1em; }
  .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
  .chat-pick { display:flex; flex-wrap:wrap; gap:6px; }
  hr { border:0; border-top:1px solid var(--line); margin:6px 0; }
  footer { color:var(--dim); font-size:12px; padding:8px 16px 20px; line-height:1.6; }
  footer a { color:var(--dim); }
  .btns a.btn, .btns label.btn { display:inline-flex; align-items:center; background:var(--line); color:var(--fg); border-radius:8px; min-height:44px; padding:0 16px; font-size:14px; text-decoration:none; cursor:pointer; }
  .notice { padding:10px 12px; border-radius:8px; background:rgba(78,161,255,.12); color:#9cc8ff; font-size:13px; line-height:1.5; }
  .notice:empty { display:none; }
  .lang { background:var(--card); color:var(--fg); border:0; border-radius:999px; min-height:32px; padding:0 12px; font:inherit; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Must Monitor</h1>
  <div class="hdr-right">
    <span id="phone" class="chip" hidden></span>
    <span id="status" class="chip" role="status">…</span>
    <button class="lang" id="langBtn" aria-label="Language / Мова">EN</button>
  </div>
</header>

<section class="hero" id="hero">
  <div class="row">
    <div class="soc" id="soc">–</div>
    <div id="state" class="chip">–</div>
  </div>
  <div class="bar"><div id="socbar" style="width:0"></div></div>
  <div class="runtime" id="runtime">–</div>
  <div class="flow" id="flow"></div>
  <div class="gridline" id="gridline"></div>
  <div class="sub" id="socsrc"></div>
  <div class="alert" id="alert"></div>
</section>

<section class="grid" id="cards"></section>
<details class="more">
  <summary data-i18n="details"></summary>
  <section class="grid" id="cards2"></section>
</details>

<div class="section-head">
  <h2 data-i18n="history"></h2>
  <div class="tabs" id="tabs" role="group" data-i18n-aria="period">
    <button data-h="1" aria-pressed="false"></button><button data-h="6" aria-pressed="false"></button><button data-h="24" aria-pressed="false"></button>
  </div>
</div>

<section class="stats" id="stats"></section>

<section class="chart">
  <div class="chart-head">
    <h2 data-i18n="chPower"></h2>
    <div class="legend">
      <span><i style="background:var(--load)"></i><span data-i18n="load"></span></span>
      <span style="color:rgba(78,161,255,.7)"><i class="dash"></i><span data-i18n="peak"></span></span>
      <span><i style="background:var(--pv)"></i>PV</span>
      <span><i style="background:var(--grid)"></i><span data-i18n="fromGrid"></span></span>
      <span><i style="background:var(--bat)"></i><span data-i18n="batteryLegend"></span></span>
    </div>
  </div>
  <div class="chart-msg" id="histMsg"></div>
  <canvas id="chPower" tabindex="0" data-i18n-aria="chPower"></canvas>
</section>

<section class="chart">
  <div class="chart-head">
    <h2 data-i18n="chSoc"></h2>
    <div class="legend"><span><i style="background:var(--ok)"></i><span data-i18n="byEnergy"></span></span><span style="color:#8a90a0"><i class="dash"></i><span data-i18n="byVoltage"></span></span></div>
  </div>
  <canvas id="chSoc" class="short" tabindex="0" data-i18n-aria="chSoc"></canvas>
</section>

<section class="chart">
  <div class="chart-head">
    <h2 data-i18n="chGrid"></h2>
    <div class="legend"><span><i style="background:var(--grid)"></i><span data-i18n="voltage"></span></span><span><i style="background:rgba(243,18,96,.5)"></i><span data-i18n="noGrid"></span></span></div>
  </div>
  <canvas id="chGrid" class="thin" tabindex="0" data-i18n-aria="chGrid"></canvas>
</section>

<section class="chart">
  <div class="chart-head"><h2 data-i18n="outages"></h2></div>
  <ul class="outages" id="outages"></ul>
</section>

<details class="settings" id="settings">
  <summary data-i18n="settings"></summary>
  <div class="form">
    <div class="notice" id="reinstallHint"></div>
    <h3>Telegram</h3>
    <div class="hint" data-i18n-html="tgSteps"></div>
    <label><span data-i18n="botToken"></span>
      <input type="password" id="tgToken" autocomplete="off" spellcheck="false">
    </label>
    <label>Chat id
      <input type="text" id="tgChat" autocomplete="off" spellcheck="false" data-i18n-ph="chatPh">
    </label>
    <div class="chat-pick" id="chatPick"></div>
    <label><span data-i18n="tgLang"></span>
      <select id="tgLang"><option value="uk">Українська</option><option value="en">English</option></select>
    </label>
    <label class="check"><input type="checkbox" id="tgEnabled"> <span data-i18n="tgEnabled"></span></label>
    <label class="check"><input type="checkbox" id="invAlert"> <span data-i18n="invAlert"></span></label>
    <label class="check"><input type="checkbox" id="phoneAlert"> <span data-i18n="phoneAlert"></span></label>
    <label><span data-i18n="phonePct"></span>
      <input type="text" id="phonePct" inputmode="numeric" placeholder="10">
    </label>
    <div class="btns">
      <button class="primary" id="btnSave" data-i18n="save"></button>
      <button id="btnDetect" data-i18n="detect"></button>
      <button id="btnTest" data-i18n="test"></button>
    </div>
    <div class="msg" id="tgMsg" aria-live="polite"></div>

    <hr>
    <h3 data-i18n="battery"></h3>
    <label><span data-i18n="capacity"></span>
      <input type="text" id="batWh" inputmode="numeric" placeholder="3000">
    </label>
    <label><span data-i18n="fullV"></span>
      <input type="text" id="batFullV" inputmode="decimal" placeholder="27.0">
    </label>
    <div class="hint" data-i18n="fullVHint"></div>
    <label><span data-i18n="sign"></span>
      <select id="batSign">
        <option value="0" data-i18n="signAuto"></option>
        <option value="1" data-i18n="signPlus"></option>
        <option value="-1" data-i18n="signMinus"></option>
      </select>
    </label>
    <div class="hint" id="batHint"></div>
    <div class="btns">
      <button class="primary" id="btnBatSave" data-i18n="save"></button>
    </div>
    <div class="msg" id="batMsg" aria-live="polite"></div>
    <div class="hint" data-i18n="socHint"></div>
    <div class="btns">
      <button class="danger" id="btnSocReset" data-i18n="socReset"></button>
    </div>

    <hr>
    <h3 data-i18n="backup"></h3>
    <div class="hint" id="backupHint"></div>
    <div class="btns">
      <a class="btn" href="/api/backup" download data-i18n="backupDl"></a>
      <label class="btn"><span data-i18n="backupRestore"></span><input type="file" id="restoreFile" accept=".json,application/json" hidden></label>
    </div>
    <div class="msg" id="bakMsg" aria-live="polite"></div>
  </div>
</details>

<footer>
  <span id="meta"></span><br>
  <a href="/metrics">/metrics</a> · <a href="/api/state">/api/state</a> · <a href="/api/history">/api/history</a>
</footer>

async function fetchJson(url, opts = {}) {

  const timer = setTimeout(() => ctl.abort(), 6000);
  try {
    const r = await fetch(url, { cache: "no-store", ...opts, signal: ctl.signal });
    const j = await r.json().catch(() => ({}));

function fmtDur(h) {
  if (!isFinite(h) || h <= 0) return "–";
  const m = Math.round(h * 60);
  if (m < 60) return m + " " + t("min");
  const d = Math.floor(m / 1440), hh = Math.floor(m % 1440 / 60), mm = m % 60;
  return (d ? d + " " + t("d") + " " : "") + hh + " " + t("h") + " " + mm + " " + t("min");
}

  return (d.toDateString() === today.toDateString() ? "" : dayName(d) + " ") + hm(ts);

let LIVE = null, lastFetchOk = 0;

  const st = $("status"), hero = $("hero");
  if (!LIVE) { st.textContent = t("connecting"); st.className = "chip"; return; }
  const sinceFetch = (Date.now() - lastFetchOk) / 1000;
  const age = LIVE.lastOk ? (nowMs() - LIVE.lastOk) / 1000 : Infinity;
  let text, cls;
  if (sinceFetch > STALE_BAD_S) { text = t("noPhone"); cls = "bad"; }
  else if (age <= STALE_WARN_S) { text = t("online"); cls = "ok"; }
  else if (age <= STALE_BAD_S) { text = t("updating"); cls = "warn"; }
  else { text = t("invSilent"); cls = "bad"; }
  st.textContent = text + (cls !== "ok" && isFinite(age) ? " · " + fmtAge(age) : "");
  st.className = "chip " + cls;
  hero.classList.toggle("stale", cls === "bad");
}

async function refresh() {
  try {
    const s = await fetchJson("/api/state");
    if (num(s.now)) srvOffset = s.now - Date.now();
    LIVE = s; lastFetchOk = Date.now();
    renderLive();

}

  const socV = v.must_battery_soc_estimate_percent;

  $("socsrc").textContent = s.socSource === "energy" ? t("socEnergy", (s.batteryWh / 1000).toFixed(1), num(socV) ? Math.round(socV) : "–")
    : s.socSource === "voltage" ? t("socVoltage") : "";

let RANGE_H = +(store.get("rangeH") || 24);
if (![1, 6, 24].includes(RANGE_H)) RANGE_H = 24;
let HIST = null, EVENTS = null, CHARTS = [], hoverT = null, drawQueued = false;

function setRange(h) {

  hoverT = null;

function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(+v.toFixed(6));
  return out;
}

function nearest(rows, ts) {
  let a = 0, b = rows.length - 1;
  if (b < 0) return null;
  while (b - a > 1) { const m = (a + b) >> 1; if (rows[m][0] < ts) a = m; else b = m; }
  const r = Math.abs(rows[a][0] - ts) <= Math.abs(rows[b][0] - ts) ? rows[a] : rows[b];
  return Math.abs(r[0] - ts) <= GAP_S ? r : null;
}

// Robust range: short spikes (kettle, switchover) must not flatten everything else.
function robustRange(vals) {
  if (!vals.length) return [0, 1];
  const s = vals.slice().sort((a, b) => a - b);
  const q = p => s[Math.min(s.length - 1, Math.max(0, Math.round(p * (s.length - 1))))];
  const lo = q(0.005), hi = q(0.995);
  const pad = (hi - lo) * 0.1 || 1;
  return [lo - (lo < 0 ? pad : 0), hi + pad];
}

const L = 40, R = 8, T = 8, B = 20;
function draw(c) {

  }

    for (const r of rows) for (const s of series) if (!s.hidden && s.scale !== false && num(r[s.i])) vals.push(r[s.i]);

    for (const r of rows) for (const s of series) if (!s.hidden && num(r[s.i])) { lo = Math.min(lo, r[s.i]); hi = Math.max(hi, r[s.i]); }

  const Y = y => T + ph - (y - lo) / (hi - lo) * ph;

  ctx.fillStyle = "rgba(243,18,96,.13)";

  }

  if (hoverT == null || hoverT < t0 || hoverT > t1) return;
  const r = nearest(rows, hoverT);
  if (!r) return;
  const x = X(r[0]);
  ctx.strokeStyle = "#5a6070"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, T); ctx.lineTo(Math.round(x) + .5, T + ph); ctx.stroke();
  const lines = [[RANGE_H >= 24 ? dayHm(r[0]) : hm(r[0]), "#e6e8ee"]];
  for (const s of series) {
    if (s.i < 0) continue;
    if (!num(r[s.i])) { if (s.naLabel && r[s.naFlag] === 1) lines.push([t(s.label) + ": " + t(s.naLabel), "#8a90a0"]); continue; }
    if (!s.hidden) { ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(x, Math.max(T, Math.min(T + ph, Y(r[s.i]))), 3, 0, 7); ctx.fill(); }
    lines.push([t(s.label) + ": " + r[s.i].toFixed(s.dec || 0) + " " + s.unit, s.hidden ? "#9aa0b0" : s.color]);
  }
  ctx.font = "12px system-ui"; ctx.textAlign = "left"; ctx.textBaseline = "top";
  const bw = Math.max(...lines.map(([s]) => ctx.measureText(s).width)) + 16, bh = lines.length * 16 + 10;
  let bx = x + 10; if (bx + bw > W - R) bx = Math.max(0, x - 10 - bw);
  const by = T + 4;
  ctx.fillStyle = "rgba(15,17,21,.94)"; ctx.strokeStyle = "#2f3440";
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, 6) : ctx.rect(bx, by, bw, bh); ctx.fill(); ctx.stroke();
  lines.forEach(([s, col], k) => { ctx.fillStyle = col; ctx.fillText(s, bx + 8, by + 6 + k * 16); });
}

function redraw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; CHARTS.forEach(draw); });
}

let hoverTimer = null;
function attachHover(el) {
  const move = e => {
    const c = CHARTS.find(c => c.el === el); if (!c) return;
    const rect = el.getBoundingClientRect();
    hoverT = c.t0 + (e.clientX - rect.left - L) / (rect.width - L - R) * (c.t1 - c.t0);
    clearTimeout(hoverTimer);
    if (e.pointerType === "touch") hoverTimer = setTimeout(() => { hoverT = null; redraw(); }, 5000);
    redraw();
  };
  el.addEventListener("pointermove", move);
  el.addEventListener("pointerdown", move);
  // On touch, pointerleave fires right after the finger lifts: keep the tooltip (it times out instead).
  el.addEventListener("pointerleave", e => { if (e.pointerType !== "touch") { hoverT = null; redraw(); } });
  el.addEventListener("keydown", e => {
    const c = CHARTS.find(c => c.el === el); if (!c || !c.rows.length) return;
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const stepS = (c.t1 - c.t0) / 60;
    hoverT = Math.max(c.t0, Math.min(c.t1, (hoverT == null ? c.t1 : hoverT) + (e.key === "ArrowLeft" ? -stepS : stepS)));
    redraw();
  });
  el.addEventListener("blur", () => { hoverT = null; redraw(); });
}
["chPower", "chSoc", "chGrid"].forEach(id => attachHover($(id)));
document.addEventListener("pointerdown", e => { if (hoverT != null && e.target.tagName !== "CANVAS") { hoverT = null; redraw(); } });

function outageIntervals(now) {
  const ev = (EVENTS && EVENTS.events) || [];
  const out = []; let offStart = null;
  ev.forEach(([ts, on], k) => {
    const s = ts / 1000;
    if (!on) offStart = s;
    else { if (offStart != null || k === 0) out.push([offStart != null ? offStart : -Infinity, s]); offStart = null; }
  });
  if (EVENTS && EVENTS.gridOn === false) out.push([offStart != null ? offStart : (EVENTS.gridSince ? EVENTS.gridSince / 1000 : -Infinity), now]);
  return out;
}

function dataHoles(rows) {
  const out = [];
  for (let k = 1; k < rows.length; k++) if (rows[k][0] - rows[k - 1][0] > NODATA_S) out.push([rows[k - 1][0], rows[k][0]]);
  return out;
}

function renderOutages() {
  if (!EVENTS) return;
  const holes = HIST ? dataHoles(HIST.rows) : [];
  const now = nowMs() / 1000, t0 = now - RANGE_H * 3600;
  const list = outageIntervals(now).filter(([a, b]) => b > t0).reverse().slice(0, 15);
  $("outages").innerHTML = list.length ? list.map(([a, b]) => {
    const ongoing = EVENTS.gridOn === false && b === now;
    const from = isFinite(a) ? dayHm(a) : "?";
    const to = ongoing ? t("now") : hm(b);
    const dur = isFinite(a) ? fmtDur((b - a) / 3600) : "";
    // if monitoring was off inside this outage, its real end/start is unknown
    const unsure = holes.some(([ha, hb]) => hb > a && ha < b);
    return `<li><span>${from} – ${to}${unsure ? ' <span class="d">' + t("unsure") + "</span>" : ""}</span><span class="d">${unsure ? "≤ " : ""}${dur}</span></li>`;
  }).join("") : `<li class="empty">${t("noOutages")}</li>`;
}

function renderHistory() {
  if (!HIST) return;
  const now = nowMs() / 1000, t1 = now, t0 = now - RANGE_H * 3600;
  const ix = k => HIST.keys.indexOf(k);
  const rows = HIST.rows.filter(r => r[0] >= t0);
  const shade = outageIntervals(now).map(([a, b]) => [Math.max(a, t0), Math.min(b, t1)]).filter(([a, b]) => b > a);

  // Time-weighted: each row is the average over the preceding ~30 s, so energy = P·dt and
  // average power = energy / covered time. Unmeasured (Bypass) and missing periods are excluded.
  const iL = ix("must_load_power_watts"), iM = ix("must_load_power_max_watts"), iP = ix("must_pv_power_watts");
  let wh = 0, pvWh = 0, covS = 0, pvS = 0, peak = null;
  for (let k = 1; k < rows.length; k++) {
    const r = rows[k], dt = r[0] - rows[k - 1][0];
    const pk = num(r[iM]) ? r[iM] : r[iL];
    if (num(pk) && (peak == null || pk > peak)) peak = pk;
    if (dt > GAP_S) continue;
    if (num(r[iL])) { wh += r[iL] * dt / 3600; covS += dt; }
    if (iP >= 0 && num(r[iP])) { pvWh += r[iP] * dt / 3600; pvS += dt; }
  }
  const holes = dataHoles(rows);
  const overlap = (a, b) => holes.reduce((s, [ha, hb]) => s + Math.max(0, Math.min(b, hb) - Math.max(a, ha)), 0);
  const offS = shade.reduce((s, [a, b]) => s + (b - a) - overlap(a, b), 0);
  const covNote = covS && covS < RANGE_H * 3600 * 0.95 ? t("measured", fmtDur(covS / 3600)) : "";
  const stats = [
    [t("sAvgLoad"), covS ? Math.round(wh / (covS / 3600)) + " W" : "–", covNote],
    [t("sPeak"), peak != null ? Math.round(peak) + " W" : "–", ""],
    [t("sUsed"), covS ? (wh / 1000).toFixed(2) + " kWh" : "–", covNote],
    ["PV", pvS && pvWh > 0 ? (pvWh / 1000).toFixed(2) + " kWh" : "–", ""],
    [t("sOutages"), String(shade.length), ""],
    [t("sOff"), offS ? fmtDur(offS / 3600) : "0 " + t("min"), ""],
  ];
  $("stats").innerHTML = stats.map(([k, v, s]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

  const iUnm = ix("must_load_power_unmeasured");
  // series labels are i18n keys, translated when drawn
  CHARTS = [
    { el: $("chPower"), rows, t0, t1, holes, opt: { zero: true, minSpan: 100, robust: true, shade }, series: [
      { i: iM, color: "rgba(78,161,255,.55)", label: "peak", unit: "W", width: 1, dash: [4, 3], scale: false, hidden: RANGE_H >= 24 },
      { i: iL, color: "#4ea1ff", fill: "rgba(78,161,255,.12)", label: "load", unit: "W", naLabel: "unmeasuredTip", naFlag: iUnm },
      { i: iP, color: "#f5c542", label: "PV", unit: "W" },
      { i: ix("must_grid_import_watts"), color: "#2dd4bf", label: "fromGrid", unit: "W", width: 1.2 },
      { i: ix("must_battery_charge_power_watts"), color: "#b57cff", label: "batteryCharge", unit: "W" },
      { i: ix("must_battery_charge_current_amps"), color: "#b57cff", label: "batteryCurrent", unit: "A", dec: 1, hidden: true },
    ] },
    { el: $("chSoc"), rows, t0, t1, holes, opt: { min: 0, max: 100, shade }, series: [
      { i: ix("must_battery_soc_estimate_percent"), color: "rgba(138,144,160,.8)", label: "byVoltage", unit: "%", width: 1, dash: [4, 3] },
      { i: ix("must_battery_soc_energy_percent"), color: "#3ecf8e", fill: "rgba(62,207,142,.10)", label: "byEnergy", unit: "%" },
      { i: ix("must_battery_voltage_volts"), color: "#3ecf8e", label: "voltage", unit: "V", dec: 1, hidden: true },
    ] },
    { el: $("chGrid"), rows, t0, t1, holes, opt: { zero: true, minSpan: 50, shade }, series: [
      { i: ix("must_grid_voltage_volts"), color: "#2dd4bf", label: "grid", unit: "V" },
    ] },
  ];
  redraw();
  renderOutages();
}

// Incremental: after the first load only rows newer than the last one are fetched.
async function loadHistory() {
  try {
    const last = HIST && HIST.rows.length ? HIST.rows[HIST.rows.length - 1][0] : 0;
    const [h, e] = await Promise.all([fetchJson("/api/history" + (last ? "?since=" + last : "")), fetchJson("/api/events")]);
    if (!HIST || !last || h.keys.join() !== HIST.keys.join()) HIST = h;
    else {
      HIST.rows.push(...h.rows);
      const cutoff = nowMs() / 1000 - (h.retentionSeconds || 86400);
      while (HIST.rows.length && HIST.rows[0][0] < cutoff) HIST.rows.shift();
    }
    EVENTS = e;
    $("histMsg").textContent = "";
    renderHistory();
  } catch (e) {
    $("histMsg").textContent = t("histErr", e.message);
  }
}
window.addEventListener("resize", redraw);

// ---------- settings ----------
let SETTINGS = null;
function say(id, text, cls) { $(id).textContent = text; $(id).className = "msg " + (cls || ""); }
async function busy(btn, fn) {
  if (btn.disabled) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = label + "…";
  try { await fn(); } finally { btn.disabled = false; btn.textContent = label; }
}
function applySettings(s) {
  SETTINGS = s;
  $("tgChat").value = s.chatId || "";
  $("tgEnabled").checked = !!s.enabled;
  $("invAlert").checked = s.inverterOfflineAlert !== false;
  $("phoneAlert").checked = !!s.phoneLowAlert;
  $("phonePct").value = s.phoneLowPercent || 10;
  $("tgLang").value = s.tgLang || "uk";
  $("tgToken").value = "";
  $("tgToken").placeholder = s.tokenSet ? t("tokenSaved", s.tokenHint) : "123456789:AA…";
  $("batSign").value = String(s.batterySign || 0);
  $("batWh").value = s.batteryWh || "";
  $("batFullV").value = s.batteryFullVolts != null ? (+s.batteryFullVolts).toFixed(1) : "";
  $("batHint").textContent = s.batterySignLearned ? t("signLearned", t(s.batterySignLearned > 0 ? "plus" : "minus")) : t("signDefault");
  $("reinstallHint").textContent = s.tokenSet ? "" : t("reinstallHint");
  $("backupHint").textContent = t("backupHint") + " " + (s.backupError ? t("backupErr", s.backupError) : s.backupLast ? t("backupLast", dayHm(s.backupLast / 1000)) : t("backupNone"));
  if (s.lastError) say("tgMsg", t("tgLastErr", s.lastError), "err");
  else if (s.lastSent) say("tgMsg", t("tgLastSent", dayHm(s.lastSent / 1000)), "ok");
}
async function loadSettings() {
  try {
    const s = await fetchJson("/api/settings");
    applySettings(s);
    if (!s.tokenSet) $("settings").open = true;
  } catch {}
}
$("btnSave").onclick = e => busy(e.target, async () => {
  const pct = +$("phonePct").value.trim();
  if (!(pct >= 1 && pct <= 90)) return say("tgMsg", t("pctErr"), "err");
  try {
    applySettings(await post("/api/settings", {
      token: $("tgToken").value, chatId: $("tgChat").value, enabled: $("tgEnabled").checked ? "1" : "0", tgLang: $("tgLang").value,
      inverterOfflineAlert: $("invAlert").checked ? "1" : "0", phoneLowAlert: $("phoneAlert").checked ? "1" : "0", phoneLowPercent: String(pct),
    }));
    say("tgMsg", t("saved"), "ok");
  } catch (e) { say("tgMsg", e.message, "err"); }
});
$("btnBatSave").onclick = e => busy(e.target, async () => {
  const wh = +$("batWh").value.trim(), fv = +$("batFullV").value.trim().replace(",", ".");
  if (!(wh >= 100 && wh <= 100000)) return say("batMsg", t("whErr"), "err");
  if (!(fv >= 10 && fv <= 70)) return say("batMsg", t("fvErr"), "err");
  try {
    applySettings(await post("/api/settings", { batteryWh: String(wh), batteryFullVolts: String(fv), batterySign: $("batSign").value }));
    say("batMsg", t("saved"), "ok"); refresh();
  } catch (e) { say("batMsg", e.message, "err"); }
});
$("btnSocReset").onclick = e => busy(e.target, async () => {
  if (!confirm(t("resetConfirm"))) return;
  try { await post("/api/settings", { socReset: "1" }); say("batMsg", t("resetDone"), "ok"); setTimeout(refresh, 6000); }
  catch (e) { say("batMsg", e.message, "err"); }
});
$("btnTest").onclick = e => busy(e.target, async () => {
  say("tgMsg", t("sending"));
  try { await post("/api/telegram/test", { token: $("tgToken").value, chatId: $("tgChat").value }); say("tgMsg", t("sent"), "ok"); }
  catch (e) { say("tgMsg", e.message, "err"); }
});
$("btnDetect").onclick = e => busy(e.target, async () => {
  say("tgMsg", t("searching")); $("chatPick").innerHTML = "";
  try {
    const { chats } = await post("/api/telegram/detect", { token: $("tgToken").value });
    if (!chats.length) return say("tgMsg", t("notFound"), "err");
    if (chats.length === 1) { $("tgChat").value = chats[0].id; return say("tgMsg", t("found", chats[0].title || chats[0].id), "ok"); }
    say("tgMsg", t("pickChat"));
    for (const c of chats) {
      const b = document.createElement("button");
      b.textContent = c.title || c.id;
      b.onclick = () => { $("tgChat").value = c.id; $("chatPick").innerHTML = ""; say("tgMsg", t("picked"), "ok"); };
      $("chatPick").appendChild(b);
    }
  } catch (e) { say("tgMsg", e.message, "err"); }
});
$("restoreFile").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f || !confirm(t("restoreConfirm", f.name))) return;
  say("bakMsg", t("restoring"));
  try {
    const r = await fetchJson("/api/restore?lang=" + LANG, {
      method: "POST", headers: { "X-Must-Monitor": "1", "Content-Type": "application/json; charset=utf-8" }, body: await f.text(),
    });
    say("bakMsg", t("restored", r.rows || 0, r.events || 0), "ok");
    HIST = null;
    loadSettings(); loadHistory(); refresh();
  } catch (err) { say("bakMsg", err.message, "err"); }
};
$("langBtn").onclick = () => setLang(LANG === "uk" ? "en" : "uk");

// ---------- start; timers pause while the tab is hidden ----------
applyStatic();
setRange(RANGE_H);
refresh(); loadHistory(); loadSettings();
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
setInterval(() => { if (!document.hidden) loadHistory(); }, 30000);
setInterval(() => { if (!document.hidden) renderStatus(); }, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); loadHistory(); } });
</script>
</body>
</html>
